[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "circuit-drawer-for-ee"
version = "1.5.0"
description = "Paper-ready power electronics circuit figures (CircuitikZ) from hand-placed, validated coordinates"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "ahainur"}]
keywords = ["power electronics", "circuitikz", "schematic", "ngspice", "simulink", "plecs"]
dependencies = []

[project.urls]
Homepage = "https://github.com/ahainur/circuit-drawer-for-ee"
Documentation = "https://github.com/ahainur/circuit-drawer-for-ee/blob/main/docs/USER_MANUAL.en.md"

[project.optional-dependencies]
ai = ["anthropic>=2.3"]

[project.scripts]
circuit-drawer = "circuit_drawer.cli:main"
circuit-drawer-control = "circuit_drawer.control.cli:main"

[project.gui-scripts]
circuit-drawer-launcher = "circuit_drawer.launcher:main"

[tool.setuptools.packages.find]
where = ["src"]


[tool.setuptools.package-data]
circuit_drawer = ["editor/static/*.html", "editor/static/*.js", "editor/static/*.css", "templates/saved_tables/*.json", "module_library/*.json", "ai/examples/*.json", "control/templates/*.json", "control/static/*.html"]
